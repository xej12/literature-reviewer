name: Windows checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Launcher environment check (no Zotero or API key required)
        shell: powershell
        run: .\scripts\start.ps1 -Check
      - name: Backend tests (mocked models only)
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Formula and source rendering checks
        run: node tests/test_deep_math.cjs
      - name: Notebook rendering and offline export checks
        run: node tests/test_notes_render.cjs
      - name: Research suggestion preview and cancellation checks
        run: node tests/test_research_suggestions.cjs
