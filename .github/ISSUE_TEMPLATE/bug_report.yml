name: 故障反馈 / Bug report
description: 报告安装、阅读或生成中的问题，请勿提交密钥和私人文献。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先查看 [故障排查](https://github.com/xej12/literature-reviewer/blob/main/docs/troubleshooting.md)，并搜索是否已有同类问题。
        **不要粘贴 API Key、整个 data/、Zotero 数据库或受版权保护的全文；截图和日志请先脱敏。**
  - type: input
    id: version
    attributes:
      label: 项目版本 / Version
      description: 提交短 SHA，或 ZIP 下载日期。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境 / Environment
      description: Windows、Python、Zotero 版本；浏览器；相关模型服务与模型 ID（不要填写 Key）。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 从启动或打开哪个页面开始，点了哪些按钮？
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与报错 / Actual behavior and errors
      description: 可附脱敏截图、启动窗口错误或环境检查结果；不要包含私人路径与文献信息。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 我已检查日志、截图和附件，不包含密钥、私人数据或无权公开的全文。
          required: true
