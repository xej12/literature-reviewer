<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Literature Reviewer</title>
  <link rel="stylesheet" href="/static/styles.css?v=analysis-progress-1" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">LOCAL RESEARCH WORKSPACE</div>
      <h1>文献梳理工具</h1>
    </div>
    <div class="top-actions"><button id="settings-button" class="settings-button">模型设置</button><div id="health" class="health pending">正在连接 Zotero…</div></div>
  </header>
  <main id="library" class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">我的文献库</div>
      <button class="collection active" data-key=""><span>全部文献</span><strong id="all-count">—</strong></button>
      <div id="collections" class="collection-list"></div>
      <div class="privacy-note"><span class="dot"></span>只读模式<br><small>数据留在本机</small></div>
    </aside>
    <section class="content">
      <div class="toolbar">
        <div>
          <div class="eyebrow">ZOTERO LIBRARY</div>
          <h2 id="section-title">全部文献</h2>
        </div>
        <label class="search"><span>⌕</span><input id="search" placeholder="搜索标题或摘要" /></label>
      </div>
      <div id="message" class="message hidden"></div>
      <div class="library-sync"><button id="refresh-library" class="secondary-button">刷新文献库</button><span id="sync-status" role="status">正在读取本机 Zotero…</span></div>
      <section id="progress-overview" class="progress-overview hidden" aria-label="分析进度总览">
        <div class="progress-heading"><div><h3>分析进度</h3><p id="progress-scope"></p></div><button id="clear-progress-filter" class="text-button" aria-pressed="true">全部状态</button></div>
        <div class="progress-cards">
          <button class="progress-card" data-status="summary" aria-pressed="false"><span>已解读</span><strong id="progress-summary">0</strong><small>篇 · 已保存论文解读</small></button>
          <button class="progress-card" data-status="unread" aria-pressed="false"><span>未解读</span><strong id="progress-unread">0</strong><small>篇 · 尚无论文解读</small></button>
          <button class="progress-card" data-status="terms" aria-pressed="false"><span>已提取术语</span><strong id="progress-terms">0</strong><small>篇 · 已保存术语解释</small></button>
          <button class="progress-card" data-status="figures" aria-pressed="false"><span>已解析图表</span><strong id="progress-figures">0</strong><small>篇 · 至少一项解析</small></button>
        </div>
        <div id="summary-progress" class="progress-track" role="progressbar" aria-label="论文解读完成比例" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="summary-progress-fill"></div></div>
        <p id="progress-description" class="progress-description"></p>
      </section>
      <div id="results-info" class="results-info" role="status"></div>
      <div id="items" class="items"></div>
    </section>
  </main>
  <main id="detail" class="detail hidden" aria-label="文献详情"></main>
  <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-card">
      <div class="modal-head"><div><div class="eyebrow">MODEL PROVIDER</div><h2 id="settings-title">模型设置</h2></div><button id="close-settings" class="close-button">×</button></div>
      <p class="modal-intro">填写一个兼容 OpenAI Chat Completions API 的服务。配置只保存在本机。</p>
      <label class="setting-field"><span>API 地址</span><input id="setting-base-url" placeholder="https://api.openai.com/v1" /></label>
      <label class="setting-field"><span>模型名称</span><input id="setting-model" placeholder="gpt-4o-mini" /></label>
      <label class="setting-field"><span>API Key <em>留空则保留已保存的 Key</em></span><input id="setting-api-key" type="password" placeholder="sk-…" /></label>
      <div id="settings-message" class="settings-message"></div>
      <div class="modal-actions"><button id="cancel-settings" class="text-button">取消</button><button id="save-settings" class="primary-button">保存配置</button></div>
    </div>
  </div>
  <div id="analysis-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="analysis-modal-title">
    <div class="analysis-modal-card">
      <div class="modal-head"><div><div id="analysis-modal-eyebrow" class="eyebrow">PAPER ANALYSIS</div><h2 id="analysis-modal-title">论文解读</h2></div><button id="close-analysis" class="close-button">×</button></div>
      <div id="analysis-modal-body" class="analysis-modal-body"></div>
    </div>
  </div>
  <script src="/static/app.js?v=analysis-progress-1"></script>
</body>
</html>
